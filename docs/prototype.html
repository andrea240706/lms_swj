<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            canvas: '#F9F8F6',
            charcoal: '#141416',
            muted: '#F1EFEA',
            subtext: '#6E6E77',
            sage: {
              light: '#EBF2D5',
              DEFAULT: '#D4E4D2',
              dark: '#3D5A45'
            },
            blossom: {
              light: '#FDF0F5',
              DEFAULT: '#FBD2E0',
              dark: '#7A3E53'
            },
            sky: {
              light: '#EAF5FE',
              DEFAULT: '#D0E8F8',
              dark: '#2C5270'
            },
            amberpastel: {
              light: '#FEF5E7',
              DEFAULT: '#FDE4C3',
              dark: '#785021'
            },
            lavender: {
              light: '#F3EFFB',
              DEFAULT: '#E2D9F3',
              dark: '#4A3B69'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #E4E2DD;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hide scrollbars inside mobile frame */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .hero-sage {
      background: linear-gradient(135deg, #CBE0C8 0%, #EBF2D5 100%);
    }
    .hero-blossom {
      background: linear-gradient(135deg, #FAD0E0 0%, #FCEBF2 100%);
    }
    .hero-sky {
      background: linear-gradient(135deg, #CBE5F8 0%, #EBF6FE 100%);
    }
    .hero-amber {
      background: linear-gradient(135deg, #FCDFB8 0%, #FEF4E4 100%);
    }
    .hero-lavender {
      background: linear-gradient(135deg, #DFD4F4 0%, #F4F0FC 100%);
    }
    .soft-shadow {
      box-shadow: 0 6px 24px -4px rgba(20, 20, 22, 0.05);
    }
    .pill-nav-shadow {
      box-shadow: 0 14px 34px -6px rgba(20, 20, 22, 0.12);
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }
    .live-dot {
      animation: pulse-dot 1.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col lg:flex-row items-center justify-center p-0 sm:p-4 lg:p-8 gap-6">

  <!-- LEFT CONTROL PANEL (Desktop Switcher to inspect all Screens & 6 Roles) -->
  <aside class="w-full max-w-[410px] lg:max-w-[340px] bg-white/90 backdrop-blur-xl rounded-[28px] p-5 soft-shadow border border-white/60 self-center lg:self-start lg:mt-4">
    <div class="flex items-center justify-between mb-3">
      <span class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-charcoal text-white">Studio Inspector</span>
      <span class="text-xs text-subtext font-medium">Mobile-First LMS</span>
    </div>
    <h1 class="text-lg font-extrabold text-charcoal leading-snug">E-Course / LMS SMK</h1>
    <p class="text-xs text-subtext mt-1 mb-4">Pilih layar otentikasi atau ganti <strong>Role Login</strong> untuk menguji struktur menu & desain setiap pengguna.</p>

    <!-- Flow Stage Selector -->
    <div class="mb-4">
      <label class="text-[11px] font-bold uppercase tracking-wider text-subtext block mb-2">1. Alur Masuk (Auth Flow)</label>
      <div class="grid grid-cols-3 gap-1.5 bg-muted p-1.5 rounded-2xl">
        <button onclick="setFlow('onboarding')" id="btn-flow-onboarding" class="text-xs font-bold py-2 px-2 rounded-xl transition-all">Onboarding</button>
        <button onclick="setFlow('login')" id="btn-flow-login" class="text-xs font-bold py-2 px-2 rounded-xl transition-all">Login</button>
        <button onclick="setFlow('app')" id="btn-flow-app" class="text-xs font-bold py-2 px-2 rounded-xl transition-all">Menu App</button>
      </div>
    </div>

    <!-- 6 Role Selector -->
    <div class="mb-4">
      <label class="text-[11px] font-bold uppercase tracking-wider text-subtext block mb-2">2. Pilih Role Pengguna (6 Roles)</label>
      <div class="grid grid-cols-2 gap-2" id="role-buttons-container">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Active Role Quick Summary -->
    <div id="inspector-role-summary" class="p-3.5 rounded-2xl bg-canvas border border-[#ECEAE4] text-xs space-y-1.5">
      <!-- Dynamic summary -->
    </div>
  </aside>

  <!-- MOBILE PHONE SIMULATOR FRAME -->
  <main class="relative w-full max-w-[400px] h-[844px] bg-canvas sm:rounded-[48px] shadow-2xl border-[10px] border-white overflow-hidden flex flex-col">
    
    <!-- Warm Top-Right Radial Glow (Matches Reference Image) -->
    <div class="pointer-events-none absolute -top-16 -right-16 w-64 h-64 rounded-full bg-[#FFE8D6] opacity-70 blur-3xl z-0"></div>

    <!-- iOS Status Bar -->
    <div class="relative z-20 flex items-center justify-between px-7 pt-3 pb-2 text-charcoal text-[13px] font-bold select-none">
      <span>9:30</span>
      <div class="flex items-center gap-1.5">
        <!-- Signal Icon -->
        <svg class="w-4 h-3.5" viewBox="0 0 16 14" fill="currentColor">
          <rect x="1" y="9" width="2.2" height="4" rx="1"/>
          <rect x="4.5" y="6.5" width="2.2" height="6.5" rx="1"/>
          <rect x="8" y="3.5" width="2.2" height="9.5" rx="1"/>
          <rect x="11.5" y="1" width="2.2" height="12" rx="1"/>
        </svg>
        <!-- Wifi -->
        <svg class="w-4 h-3.5" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M1.5 4.5C5.2 1.2 10.8 1.2 14.5 4.5"/>
          <path d="M4 7.5C6.3 5.5 9.7 5.5 12 7.5"/>
          <circle cx="8" cy="10.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <!-- Battery -->
        <div class="flex items-center">
          <div class="w-6 h-3 rounded-[4px] border border-charcoal/80 p-0.5 flex items-center">
            <div class="w-full h-full bg-charcoal rounded-[2px]"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- DYNAMIC VIEWPORT CONTAINER -->
    <div id="mobile-viewport" class="relative z-10 flex-1 flex flex-col overflow-hidden">
      <!-- Populated dynamically via JS -->
    </div>

  </main>

  <!-- MODAL / BOTTOM SHEET FOR INTERACTIVE ACTIONS (Grading, Upload, Attendance, Lesson View) -->
  <div id="action-sheet-backdrop" onclick="closeSheet()" class="fixed inset-0 bg-charcoal/40 backdrop-blur-xs hidden items-end justify-center z-50 p-0 sm:p-4">
    <div onclick="event.stopPropagation()" id="action-sheet-content" class="w-full max-w-[400px] bg-white rounded-t-[32px] sm:rounded-[32px] p-6 shadow-2xl transition-all">
      <!-- Dynamic Modal Content -->
    </div>
  </div>

  <script>
    /********************************************************************
     * DATA STORE & CONFIGURATION FOR ALL 6 ROLES (ZERO-BLOAT PRD)
     ********************************************************************/
    const ROLES = {
      siswa: {
        id: 'siswa',
        label: 'Siswa',
        badge: 'XII RPL 1',
        userName: 'Nadia Putri',
        userSub: 'NISN: 008492104 • Rekayasa Perangkat Lunak',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
        heroStyle: 'hero-sage',
        focusNote: 'Akses sesi aktif, unduh modul belajar, kumpul tugas, & isi presensi mandiri.',
        tabs: [
          { id: 'home', label: 'Home', icon: 'home' },

      },
      wali_kelas: {

        userSub: 'Kepala SMKN 1 Nusantara',
        avatar: 'https://images.unsplash.com/photo-1560250097-0b93528c311a?w=150&auto=format&fit=crop&q=80',
        heroStyle: 'hero-amber',
        focusNote: 'Monitoring keterlaksanaan KBM makro, analitik jurusan, & unduh PDF resmi.',
        tabs: [
          { id: 'home', label: 'Home', icon: 'home' },
          { id: 'jurusan', label: 'Jurusan', icon: 'chart' },
          { id: 'kbm', label: 'KBM', icon: 'book' },
          { id: 'ekspor', label: 'Ekspor', icon: 'download' }
        ]
      },
      admin: {
        id: 'admin',
        label: 'Admin TU',
        badge: 'Operator',
        userName: 'Rizky Pratama',
        userSub: 'Operator Akademik & Kesiswaan',
        avatar: 'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=150&auto=format&fit=crop&q=80',
        heroStyle: 'hero-lavender',
        focusNote: 'Kelola siswa, reset sandi instan, plotting guru/wali kelas, & koreksi absen.',
        tabs: [
          { id: 'home', label: 'Home', icon: 'home' },
          { id: 'pengguna', label: 'Siswa', icon: 'user' },
          { id: 'plotting', label: 'Plotting', icon: 'book' },
          { id: 'moderasi', label: 'Koreksi', icon: 'clock' }
        ]
      },
      super_admin: {
        id: 'super_admin',
        label: 'Super Admin',
        badge: 'Root System',
        userName: 'Arif Darmawan',
        userSub: 'Kepala Pusdatin & Infrastruktur IT',
        avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80',
        heroStyle: 'hero-sage',
        focusNote: 'Konfigurasi tahun ajaran aktif, data master jurusan/mapel, & audit log.',
        tabs: [
          { id: 'home', label: 'Home', icon: 'home' },
          { id: 'master', label: 'Master', icon: 'book' },
          { id: 'akses', label: 'Pejabat', icon: 'user' },
          { id: 'log', label: 'Audit', icon: 'chart' }
        ]
      }
    };

    // Interactive Mutable State
    let state = {
      flow: 'app',         // 'onboarding' | 'login' | 'app'
      role: 'siswa',       // current active role key
      activeTab: 'home',   // current bottom bar tab id
      selectedDay: 17,     // capsule calendar day (17-23)
      studentAttendanceDone: false,
      teacherGateOpen: true,
      materialsLock: {
        1: false,
        2: false,
        3: true,
        4: true
      },
      assignments: [
        { id: 101, title: 'Praktikum REST API Laravel 13', subject: 'Pemrograman Web', due: 'Hari ini, 16:00', status: 'Perlu Dikumpulkan', score: null, feedback: '', allowRevision: true },
        { id: 102, title: 'Desain ERD Sistem Kasir SMK', subject: 'Basis Data', due: '22 Okt 2026', status: 'Dinilai', score: 92, feedback: 'Relasi antar tabel sudah sangat rapi dan memenuhi 3NF.', allowRevision: false },
        { id: 103, title: 'Konfigurasi VLAN & Routing Statis', subject: 'Infrastruktur Jaringan', due: '18 Okt 2026', status: 'Perlu Revisi', score: 70, feedback: 'Sub-interface router belum diberi IP gateway yang sesuai.', allowRevision: true }
      ]
    };

    const DAYS = [
      { d: 'Sun', n: 17 },
      { d: 'Mon', n: 18 },
      { d: 'Tue', n: 19 },
      { d: 'Wed', n: 20 },
      { d: 'Thu', n: 21 },
      { d: 'Fri', n: 22 },
      { d: 'Sat', n: 23 }
    ];

    /********************************************************************
     * ICON HELPER (CLEAN SVG LINE ICONS - NO EMOJI BLOAT)
     ********************************************************************/
    function getIcon(name, cls = 'w-5 h-5') {
      const icons = {
        home: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>`,
        book: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
        task: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9 9h6"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>`,
        chart: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>`,
        clock: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
        user: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c1.5-3.5 4.2-5 7-5s5.5 1.5 7 5"/></svg>`,
        download: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>`,
        menu: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h10"/><path d="M4 17h14"/></svg>`,
        back: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>`,
        play: `<svg class="${cls}" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg>`,
        check: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
        lock: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
        unlock: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-1.8"/></svg>`,
        arrowUpRight: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>`
      };
      return icons[name] || icons.home;
    }

    /********************************************************************
     * STUDIO INSPECTOR CONTROLS
     ********************************************************************/
    function renderInspector() {
      // Flow Buttons
      ['onboarding', 'login', 'app'].forEach(f => {
        const btn = document.getElementById(`btn-flow-${f}`);
        if (state.flow === f) {
          btn.className = 'text-xs font-bold py-2 px-2 rounded-xl bg-charcoal text-white shadow-xs transition-all';
        } else {
          btn.className = 'text-xs font-semibold py-2 px-2 rounded-xl text-subtext hover:text-charcoal transition-all';
        }
      });

      // Role Buttons
      const roleContainer = document.getElementById('role-buttons-container');
      roleContainer.innerHTML = Object.values(ROLES).map(r => {
        const active = state.role === r.id;
        return `
          <button onclick="selectRole('${r.id}')" class="flex items-center justify-between px-3 py-2.5 rounded-2xl border text-left transition-all ${
            active
              ? 'bg-charcoal text-white border-charcoal shadow-xs'
              : 'bg-canvas text-charcoal border-[#E8E6E0] hover:border-charcoal/40'
          }">
            <div>
              <div class="text-xs font-bold leading-tight">${r.label}</div>
              <div class="text-[10px] ${active ? 'text-white/75' : 'text-subtext'} mt-0.5">${r.badge}</div>
            </div>
            <span class="w-2 h-2 rounded-full ${active ? 'bg-[#B9E2A7]' : 'bg-transparent'}"></span>
          </button>
        `;
      }).join('');

      // Active Role Info
      const currentRole = ROLES[state.role];
      document.getElementById('inspector-role-summary').innerHTML = `
        <div class="flex items-center gap-2.5">
          <img src="${currentRole.avatar}" class="w-9 h-9 rounded-full object-cover border border-white shadow-xs" alt="${currentRole.userName}"/>
          <div>
            <div class="font-bold text-charcoal leading-tight">${currentRole.userName}</div>
            <div class="text-[11px] text-subtext">${currentRole.label} • ${currentRole.badge}</div>
          </div>
        </div>
        <p class="text-[11px] text-subtext pt-1 border-t border-[#ECEAE4] leading-relaxed">${currentRole.focusNote}</p>
      `;
    }

    function setFlow(flowName) {
      state.flow = flowName;
      renderInspector();
      renderViewport();
    }

    function selectRole(roleKey) {
      state.role = roleKey;
      state.activeTab = ROLES[roleKey].tabs[0].id;
      state.flow = 'app';
      renderInspector();
      renderViewport();
    }

    function selectTab(tabId) {
      state.activeTab = tabId;
      renderViewport();
    }

    function selectDay(dayNum) {
      state.selectedDay = dayNum;
      renderViewport();
    }

    /********************************************************************
     * SCREEN 1: ONBOARDING (MATCHES LEFT SCREEN IN IMAGE REFERENCE)
     ********************************************************************/
    function renderOnboardingScreen() {
      return `
        <div class="flex-1 flex flex-col justify-between overflow-hidden pt-2">
          <!-- Top Student Portrait with Pastel Rainbow Arcs -->
          <div class="relative flex-1 flex items-end justify-center overflow-hidden px-6">
            <!-- Pastel Concentric Rainbow Rings -->
            <div class="absolute bottom-[-90px] w-[320px] h-[320px] rounded-full border-[18px] border-[#BDE0C2]/70"></div>
            <div class="absolute bottom-[-90px] w-[284px] h-[284px] rounded-full border-[18px] border-[#F9D6C1]/80"></div>
            <div class="absolute bottom-[-90px] w-[248px] h-[248px] rounded-full border-[18px] border-[#F8C7D8]/70"></div>
            <div class="absolute bottom-[-90px] w-[212px] h-[212px] rounded-full bg-[#ECE9E2]"></div>

            <!-- Student Hero Image -->
            <img
              src="https://images.unsplash.com/photo-1544717305-2782549b5136?w=600&auto=format&fit=crop&q=80"
              alt="Pelajar SMK"
              class="relative z-10 w-[235px] h-[290px] object-cover object-top rounded-t-[110px] drop-shadow-xl"
            />
          </div>

          <!-- Bottom White Rounded Sheet -->
          <div class="relative z-20 bg-white rounded-t-[38px] px-7 pt-8 pb-8 shadow-[0_-10px_35px_rgba(20,20,22,0.06)] text-center">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sage-light text-sage-dark text-[11px] font-bold mb-3">
              <span class="w-1.5 h-1.5 rounded-full bg-sage-dark"></span>
              E-Course & LMS Vokasi SMK
            </span>
            <h2 class="text-[27px] font-extrabold text-charcoal leading-[1.18] tracking-tight">
              Siap Memulai Perjalanan Belajarmu!
            </h2>
            <p class="text-[13px] text-subtext mt-3 leading-relaxed px-2">
              Akses modul praktik, presensi kehadiran mandiri, dan pengumpulan tugas dalam satu genggaman.
            </p>

            <!-- Capsule Slide/Continue Button (Exact match to Left Image) -->
            <button
              onclick="setFlow('login')"
              class="mt-7 w-full bg-[#F1EFEA] hover:bg-[#E7E4DD] active:scale-[0.99] transition-all p-2 rounded-full flex items-center justify-between group"
            >
              <span class="w-12 h-12 rounded-full bg-white text-charcoal flex items-center justify-center shadow-xs group-hover:translate-x-1 transition-transform">
                ${getIcon('check', 'w-5 h-5')}
              </span>
              <span class="text-sm font-bold text-charcoal">Lanjutkan</span>
              <span class="pr-4 text-subtext font-bold tracking-widest text-xs flex items-center gap-0.5">
                <span class="opacity-40">&gt;</span>
                <span class="opacity-70">&gt;</span>
                <span class="text-charcoal">&gt;</span>
              </span>

        return;
      }
      if (state.flow === 'login') {
        container.innerHTML = renderLoginScreen();
        return;
      }

      let roleContent = '';
      if (state.role === 'siswa') roleContent = renderSiswaContent();
      else if (state.role === 'guru') roleContent = renderGuruContent();
      else if (state.role === 'wali_kelas') roleContent = renderWaliKelasContent();
      else if (state.role === 'kepsek') roleContent = renderKepsekContent();
      else if (state.role === 'admin') roleContent = renderAdminContent();
      else roleContent = renderSuperAdminContent();

      container.innerHTML = `
        ${roleContent}
        ${renderFloatingBottomNav()}
      `;
    }

          </div>
          <div class="mt-3">
            <label class="text-xs font-bold text-charcoal block mb-1">Catatan Feedback Guru</label>
            <input type="text" value="Endpoint berjalan baik dan struktur rapi." class="w-full px-3.5 py-2.5 rounded-xl border border-[#E6E4DF] text-xs"/>
          </div>
          <button onclick="closeSheet(); renderViewport();" class="mt-4 w-full py-3.5 rounded-full bg-charcoal text-white text-xs font-bold">
            Simpan Nilai & Kirim Feedback
          </button>
        </div>
      `);
    }

    function openRoleSwitcherSheet() {
      openSheet(`
        <div>
          <h3 class="text-base font-extrabold text-charcoal mb-3">Pindah Role Simulasi Cepat</h3>
          <div class="grid grid-cols-2 gap-2">
            ${Object.values(ROLES).map(r => `
              <button
                onclick="selectRole('${r.id}'); closeSheet();"
                class="p-3 rounded-2xl border text-left ${
                  state.role === r.id ? 'bg-charcoal text-white border-charcoal' : 'bg-canvas text-charcoal border-[#E6E4DF]'
                }"
              >
                <div class="text-xs font-bold">${r.label}</div>
                <div class="text-[10px] opacity-75">${r.badge}</div>
              </button>
            `).join('')}
          </div>
        </div>
      `);
    }

    function openPasswordHelpSheet() {
      openToastSheet('Silakan hubungi Operator Admin TU Sekolah untuk mereset kata sandi akun Anda secara instan.');
    }

    function openToastSheet(msg) {
      openSheet(`
        <div class="text-center">
          <div class="w-11 h-11 rounded-full bg-sage-light text-sage-dark mx-auto flex items-center justify-center mb-3">
            ${getIcon('check', 'w-5 h-5')}
          </div>
          <p class="text-sm font-bold text-charcoal">${msg}</p>
          <button onclick="closeSheet()" class="mt-4 w-full py-3 rounded-full bg-charcoal text-white text-xs font-bold">Tutup</button>
        </div>
      `);
    }

    // Initialize App
    renderInspector();
    renderViewport();
  </script>
</body>
</html>
